<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="chTitle">Top requests — Noderunners Radio</title>
<style>
  :root{ --ether:#0a1a1f; --ether-2:#0f262d; --ether-3:#0c2027; --foam:#e6eff0; --foam-dim:#8aa4aa; --line:#1d3a42; --signal:#f7931a; --signal-2:#d06b29; --signal-dim:#b86d12; --radio-fill:#37525a; }
  * { box-sizing:border-box; }
  html{ background:var(--ether); }
  body{
    background:transparent; color:var(--foam); margin:0; padding:0 20px 40px;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    line-height:1.6;
  }
  body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:url("/assets/ship-bg.jpg") center 20% / cover no-repeat; opacity:0.14;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.25) 55%, transparent);
            mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.25) 55%, transparent); }
  body::after{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse at 20% 0%, rgba(247,147,26,0.06), transparent 55%); }
  .wrap{ max-width:760px; margin:0 auto; }
  .mainmenu { display:flex; flex-wrap:wrap; gap:4px; padding:6px 0; border-bottom:1px solid var(--line); }
  .mainmenu a { color:var(--foam-dim); text-decoration:none; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; padding:2px 12px; border-radius:4px; transition:.15s; }
  .mainmenu a:hover { color:var(--foam); background:rgba(247,147,26,0.08); }

  /* Phones: the menu wraps instead of shoving the whole page sideways
     (six links measured 448px inside a 320px bar -- found 2026-07-28). */
  @media (max-width: 560px) {
    .mainmenu { gap: 2px; padding: 3px 6px; }
    .mainmenu a { font-size: 0.66rem; padding: 3px 8px; letter-spacing: 0.05em; }
  }

  .mainmenu a.active { color:var(--signal); }
  h1{ color:var(--signal); font-size:1.5rem; margin:34px 0 6px; }
  .sub{ color:var(--foam-dim); font-size:0.9rem; margin-bottom:26px; }
  .card{ background:rgba(15,38,45,0.82); border:1px solid var(--line); border-radius:8px; padding:20px 24px; margin:18px 0; }
  h2{ color:var(--signal); font-size:1.05rem; margin:0 0 10px; }
  a{ color:var(--signal); }
  .muted{ color:var(--foam-dim); font-size:0.85rem; }
  .ladder{ display:flex; flex-direction:column; gap:12px; }
  .tier{ background:var(--ether-2); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .tier.now{ border-color:var(--signal-dim); box-shadow:0 0 0 1px rgba(247,147,26,.12) inset; }
  .tier-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .tier-name{ display:flex; align-items:center; gap:10px; }
  .pill{ font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--foam-dim); }
  .pill.on{ color:var(--ether); background:var(--signal); border-color:var(--signal); }
  .tier-name .nm{ font-weight:700; }
  .splitnums{ font-variant-numeric:tabular-nums; font-size:1.05rem; font-weight:700; letter-spacing:.02em; }
  .splitnums .r{ color:var(--foam-dim); }
  .splitnums .sep{ color:var(--line); margin:0 6px; }
  .splitnums .y{ color:var(--signal); }
  .bar{ display:flex; height:14px; margin-top:11px; border-radius:3px; overflow:hidden; border:1px solid var(--line); }
  .bar .seg-r{ background:var(--radio-fill); }
  .bar .seg-y{ background:var(--signal); }
  .tier-cap{ margin-top:9px; font-size:.85rem; color:var(--foam-dim); }
  .legend{ display:flex; gap:16px; margin-top:10px; font-size:.7rem; color:var(--foam-dim); letter-spacing:.04em; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .sw{ width:11px; height:11px; border-radius:2px; border:1px solid var(--line); display:inline-block; }
  .sw.y{ background:var(--signal); } .sw.r{ background:var(--radio-fill); }
  .why{ margin-top:16px; padding:16px 18px; border:1px solid var(--line); border-left:3px solid var(--signal);
    border-radius:0 6px 6px 0; background:var(--ether-3); }
  .why .eyebrow{ display:block; margin-bottom:8px; font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--signal); }
  .why p{ color:var(--foam); margin:0; }
  .shipname{ color:var(--foam); font-weight:700; letter-spacing:.02em; white-space:nowrap; }
  ul{ margin:8px 0; padding-left:22px; }
  li{ margin:5px 0; }

  header.sitehead { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; padding:22px 0 16px; border-bottom:1px solid var(--line); }
  .header-left { grid-column:1; justify-self:start; display:flex; align-items:center; gap:12px; }
  .hd-avatar { width:48px; height:48px; border-radius:50%; border:2px solid var(--signal-2, #d06b29); background:#000; }
  .brand { display:flex; flex-direction:column; align-items:center; gap:6px; grid-column:2; }
  .brand .logo { height:38px; width:auto; }
  .brand .coords { font-size:0.62rem; color:var(--foam-dim); letter-spacing:0.14em; text-transform:uppercase; text-align:center; }
  .socials { grid-column:3; justify-self:end; display:inline-flex; gap:6px; }
  .socials a { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:1px solid var(--line); border-radius:6px; color:var(--foam-dim); transition:.15s; }
  .socials a:hover { color:var(--signal); border-color:var(--signal-dim, #b86d12); background:rgba(247,147,26,0.06); }
  .socials a svg { width:16px; height:16px; }
/* nr_header_mobile (2026-09-14): narrow screens -- avatar+badge left, socials right, wordmark on its own row under them.
   Desktop untouched. Same fix as the homepage. */
@media (max-width: 720px) {
  header.sitehead { grid-template-columns:1fr auto; grid-template-areas:"left socials" "brand brand"; gap:10px; padding:16px 0 12px; }
  header.sitehead .header-left { grid-area:left; }
  header.sitehead .socials { grid-area:socials; }
  header.sitehead .brand { grid-area:brand; justify-self:center; }
  header.sitehead .brand .logo { height:auto; width:240px; max-width:calc(100vw - 40px); }
}
@media (max-width: 400px) {
  header.sitehead .socials a { width:30px; height:30px; }
  header.sitehead .socials a svg { width:14px; height:14px; }
  header.sitehead .header-left { gap:8px; }
  header.sitehead .live-dot { letter-spacing:.08em; }
  header.sitehead .socials { gap:4px; }
  .hd-avatar { width:44px; height:44px; }
}
  .live-dot { display:inline-flex; align-items:center; gap:8px; font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--foam-dim); }
  .live-dot .dot { width:9px; height:9px; border-radius:50%; background:var(--foam-dim); }
  .live-dot.on { color:var(--signal); }
  .live-dot.on .dot { background:var(--signal); }

  /* nr_i18n (2026-09-11) + nr_langdd (2026-09-12, SF: "it takes up too much space"): the language switch is ONE
     PILL showing the current language; a tap opens the six under it. The two-letter CODES carry the meaning, flags
     decorate; the current row is bold with a check mark. Works in black and white. Native <details>: no script to open. */
  .nrLang { position: relative; display: inline-flex; align-items: center; font-size: 0.66rem; letter-spacing: 0.06em; color: var(--foam, #fff); }
  .nrLang .nrDd { position: relative; }
  .nrLang .nrDd > summary { list-style: none; display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px;
    border: 1px solid var(--nrLangEdge, var(--signal, #f7931a)); border-radius: 3px; cursor: pointer; font-weight: 700; line-height: 1.4; user-select: none; }
  .nrLang .nrDd > summary::-webkit-details-marker { display: none; }
  .nrDd > summary { color: var(--foam-dim, var(--ink-dim, var(--mist, #9aa))); }
  .nrDd > summary:hover, .nrDd[open] > summary { color: var(--foam, var(--ink, var(--paper, #fff))); }
  .nrLang .nrDd > summary:focus-visible { outline: 3px solid var(--signal, #f5a623); outline-offset: 2px; }
  .nrLang .nrCaret { display: inline-block; font-size: 0.8em; transition: transform .15s; }
  .nrLang .nrDd[open] > summary .nrCaret { transform: rotate(180deg); }
  .nrLang .nrDdMenu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 12em; max-width: calc(100vw - 16px);
    display: grid; gap: 2px; padding: 4px; background: #0f141b; color: var(--foam, #fff); border: 1px solid currentColor;
    border-radius: 8px; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.45); text-align: left; }
  .nrLang .nrDdMenu a, .nrLang .nrDdMenu .cur { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px;
    white-space: nowrap; text-decoration: none; color: inherit; border: 2px solid transparent; min-height: 32px; box-sizing: border-box;
    text-transform: none; font-weight: 400; }
  .nrLang .nrDdMenu a:hover, .nrLang .nrDdMenu a:focus-visible { border-color: currentColor; outline: none; }
  .nrLang .nrDdMenu b { font-weight: 700; }
  .nrLang .nrDdMenu .cur { font-weight: 700; }
  .nrLang .nrDdMenu .nm { font-weight: 400; letter-spacing: 0; }
  .nrLang .nrDdMenu .ck { margin-left: auto; font-weight: 700; }
  /* closed = hidden, said outright: an author display rule on the menu must never beat the browser's own hiding */
  .nrLang .nrDd:not([open]) > .nrDdMenu { display: none; }
  .nrLang svg { border-radius: 2px; flex: none; }
  .nrEnCounts { font-size: 0.62rem; font-style: italic; opacity: 0.8; }
  /* In the radio's main menu the pill sits right after "Log in", at the menu's own small size. */
  .mainmenu .nrLang { display: inline-flex; margin-left: 6px; }
  /* nr_menuend (2026-09-15, SF: "LOG IN & language pill don't stick to the right of the menu bar anymore"): Log in
     and the language pill are ONE group at the right end of its line, also when the menu wraps. */
  .nrMenuEnd { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .nrMenuEnd .nrLang { margin-left: 2px; }
  .mainmenu .nrLang .nrDd > summary { padding: 1px 7px; font-size: 0.62rem; letter-spacing: 0.04em; }
  /* The jukebox-mode copy (the phone page behind the arcade QR) sits in the narrow #jukeBanner: the same small pill. */
  #jukeBanner .nrLang .nrDd > summary { padding: 1px 6px; font-size: 0.62rem; letter-spacing: 0.04em; gap: 4px; }
  /* that pill stands at the LEFT of the banner, so its list opens to the right, inside a 375 px screen */
  #jukeBanner .nrLang .nrDdMenu { right: auto; left: 0; }

  /* nr_hdr4 (2026-09-15, SF): badge under the N; the full logo between the two sets, shrinking as needed; Log in + language
     above the social icons. Optical centring: equal side columns, the wordmark nudged 4% right and up (its ink mass sits low-left). */
  header, header.sitehead{grid-template-columns:1fr auto 1fr;grid-template-areas:"left brand right";align-items:center;gap:12px;padding:22px 0 18px}
  header .header-left, header.sitehead .header-left{grid-area:left;flex-direction:column;align-items:center;gap:6px;justify-self:start}
  header .header-left .live-dot, header.sitehead .header-left .live-dot{margin:0}
  header .brand, header.sitehead .brand{grid-area:brand;justify-self:center;min-width:0;align-items:center}
  header .brand a, header.sitehead .brand a{display:block;width:clamp(120px,34vw,300px);margin:0 auto;transform:translate(4%,-4%)}
  header .brand .logo, header.sitehead .brand .logo{height:auto;width:100%;max-width:none}
  .hdRight{grid-area:right;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .hdRight .socials{grid-column:auto;grid-area:auto;justify-self:auto}
  .hdRight .nrMenuEnd{margin-left:0;display:inline-flex;align-items:center;gap:6px}
  .hdRight .nrMenuEnd a{color:var(--foam-dim);text-decoration:none;font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;padding:2px 10px;border-radius:4px}
  .hdRight .nrMenuEnd a:hover{color:var(--foam);background:rgba(247,147,26,0.08)}
  .hdRight .nrLang{display:inline-flex;margin-left:0}
  .hdRight .nrLang .nrDd > summary{padding:1px 7px;font-size:0.62rem;letter-spacing:0.04em}
  @media (max-width:720px){header, header.sitehead{gap:8px;padding:14px 0 12px}.hdRight{gap:6px}.hdRight .nrMenuEnd a{padding:2px 6px}.hdRight .socials{gap:4px}.hdRight .socials a{width:28px;height:28px}}
</style>
</head>

  <h1 data-i18n="chH1">Top requests</h1>
  <div class="sub" data-i18n="chSub">The songs the crowd picks most on the jukebox. Counted from the station's play log; never who asked.</div>

  <!-- nr_charts (2026-10-17): the chart itself is drawn by /assets/nr-charts-1.js from /api/charts -->
  <div class="card" id="nrChartPage"><p class="muted">Loading…</p></div>
  <noscript><p class="muted">This chart needs JavaScript. The jukebox itself is on the <a href="/">homepage</a>.</p></noscript>
<div class="nrEnCounts" data-i18n="englishCounts" hidden style="margin:18px 0 0;font-size:0.72rem;">Translated from English. If anything differs, the English text counts.</div>

<script>
  // nr_i18n (2026-09-11, SF: six languages on all his sites). ONE page, one dictionary per language,
  // English fallback. ?lang=xx for this view; a TAP on the switch also remembers it (localStorage nrLang).

  // rewritten -- the markup already says it. See plan/radio_i18n_runtime.py.
